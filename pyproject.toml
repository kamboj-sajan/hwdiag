[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "hwdiag"
version = "0.1.0"
description = "Harness for the hwdiag Linux hardware diagnostics tools: run suites, plot reports, compare runs, stress tests."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["jsonschema>=4.17", "matplotlib>=3.7"]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.4"]

[project.scripts]
hwdiag = "hwdiag.cli:main"

[tool.setuptools]
package-dir = { "" = "harness" }
packages = ["hwdiag"]

[tool.setuptools.package-data]
hwdiag = ["schema.json"]

[tool.pytest.ini_options]
testpaths = ["tests/python"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
